<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use env(safe-area-inset-*) for the notch / home-indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Monitor Commander</title>
    <meta name="description" content="Monitor Commander — a monitoring theme for the Monitor probe.">

    <!-- ── PWA / favicons ──────────────────────────────────────────────
         theme-color is overwritten at runtime by useTheme to match the
         current visual theme (lumina/clean → light, deepspace → dark);
         the static value is the deepspace background as a sensible
         pre-hydration default. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monitor" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Display/UI fonts (Orbitron + IBM Plex Sans) are self-hosted under
      /fonts so the theme keeps working offline and on networks where
      font CDNs are unreachable. The stylesheet is tiny and local, so it
      loads on the critical path without any media-swap trick.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
