<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use env(safe-area-inset-*) for the notch / home-indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Monitor Commander</title>
    <meta name="description" content="Monitor Commander — a monitoring theme for the Monitor probe.">

    <!-- ── PWA / favicons ──────────────────────────────────────────────
         theme-color is overwritten at runtime by useTheme to match the
         current visual theme (lumina/clean → light, deepspace → dark);
         the static value is the deepspace background as a sensible
         pre-hydration default. -->
    <!-- 站点图标：hub 1.4.0 起由面板「设置 → 站点图标」管 —— 站长设了之后这两条路径都由
         hub 回答（它还会给地址带上内容版本号）；没设时按同名文件回落到主题自带的
         public/favicon.svg 与 public/apple-touch-icon.png（外加 -precomposed 一份）。
         主题运行时不再改写 <link>。favicon.ico 不放 <link>：老客户端/书签管理器会直接
         来要 /favicon.ico，hub 同样提供这条路径（目录里挂着同名文件）。 -->
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monitor" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Display/UI fonts (Orbitron + IBM Plex Sans) are self-hosted under
      /fonts so the theme keeps working offline and on networks where
      font CDNs are unreachable. The stylesheet is tiny and local, so it
      loads on the critical path without any media-swap trick.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Country flags ship as bundled SVGs (flag-icons): Windows has no emoji
         flag glyphs and degrades 🇯🇵 to the bare letters "JP", so flag emoji
         are never rendered directly. -->
    <link rel="stylesheet" href="/vendor/flag-icons.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
